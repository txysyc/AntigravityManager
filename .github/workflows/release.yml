name: 发行管理器

on:
  push:
    tags:
      - 'manager-v*'

permissions:
  contents: read

concurrency:
  group: manager-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: 校验发行标签
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出标签和分支历史
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 确认标签提交已进入 main
        shell: bash
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo '::error::无法获取远端 main 分支，发行已停止。'
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::标签指向的提交尚未进入 main，发行已停止。'
            exit 1
          fi

  test:
    name: 发行前测试
    needs: validate-tag
    uses: ./.github/workflows/test.yml

  release:
    name: 打包并创建 GitHub Release
    needs: test
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 检出标签源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: 配置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          architecture: x64
          package-manager-cache: false
      - name: 核对标签并生成发行说明
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "manager-v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与管理器版本 $version 不一致。"
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '无法确定发行提交。' }
          $blob = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$commit"
          $notesPath = Join-Path $env:RUNNER_TEMP 'antigravity-release-notes.md'
          node scripts/release-notes.cjs $notesPath $blob
          if ($LASTEXITCODE -ne 0) { throw '发行说明检查失败。' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notesPath" >> $env:GITHUB_OUTPUT
      - name: 构建并校验 Windows x64 单文件
        shell: pwsh
        env:
          MANAGER_UPDATE_PUBLIC_KEY: ${{ vars.MANAGER_UPDATE_PUBLIC_KEY }}
        run: ./scripts/publish.ps1 -UpdatePublicKey $env:MANAGER_UPDATE_PUBLIC_KEY
      - name: 生成并签名更新清单
        shell: pwsh
        env:
          MANAGER_UPDATE_PUBLIC_KEY: ${{ vars.MANAGER_UPDATE_PUBLIC_KEY }}
          MANAGER_UPDATE_PRIVATE_KEY: ${{ secrets.MANAGER_UPDATE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          if (!$env:MANAGER_UPDATE_PUBLIC_KEY -and !$env:MANAGER_UPDATE_PRIVATE_KEY) {
            Write-Warning '尚未配置更新密钥，本次发行仅提供手动下载。'
            return
          }
          $exe = "output/AntigravityManager-$env:RELEASE_VERSION-win-x64.exe"
          node scripts/sign-update.cjs sign $exe $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw '更新清单签名失败。' }
      - name: 创建发行并上传附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $env:RELEASE_VERSION
          $exe = "output/AntigravityManager-$version-win-x64.exe"
          $files = @($exe, "$exe.sha256")
          if (Test-Path -LiteralPath 'output/update-win-x64.json.sig') {
            $files += @('output/update-win-x64.json', 'output/update-win-x64.json.sig')
          }
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --verify-tag --title "Antigravity Manager v$version" --notes-file $env:RELEASE_NOTES
