name: 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # 普通 CI 按 main 或 PR 编号分组，手动与发行调用按运行编号隔离。
  group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'antigravity-test-main') || (github.event_name == 'pull_request' && format('antigravity-test-pr-{0}', github.event.pull_request.number)) || format('antigravity-test-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  test:
    name: Windows 构建与检查
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: 检查项目规范
        run: npm run check:guidelines
      - name: 测试汉化引擎（无第三方程序样本）
        run: npm run test:ci
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: 测试 Go 管理器
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: 构建并检查 Go 单文件
        run: ./scripts/publish.ps1
